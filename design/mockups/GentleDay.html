<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gentle day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0F0B11}
*{box-sizing:border-box}
.scr{width:412px;height:915px;background:radial-gradient(120% 55% at 50% -12%,#2A1C2E 0%,#161118 62%);color:#F4EDEA;font-family:Figtree,system-ui,sans-serif;position:relative;overflow:hidden}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scrim{position:absolute;inset:0;background:rgba(8,5,10,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#211A24;border-radius:36px 36px 0 0;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 -18px 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
.hnd{width:40px;height:5px;border-radius:99px;background:#4A3D50;margin:10px auto 0;flex:none}
.cap{font:500 13px/18px Figtree,sans-serif;color:#9A8D95;margin:0}
.ex{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:#2B2230;border:0;color:#F4EDEA;text-align:left;width:100%;font-family:Figtree,sans-serif;min-height:60px}
.exn{font:600 15px/20px Figtree,sans-serif}
.exm{font:500 13px/18px Figtree,sans-serif;color:#9A8D95}
.ch{width:18px;height:18px;color:#9A8D95}
.btn{height:56px;width:100%;border-radius:999px;border:0;font:700 17px/20px Figtree,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px}
.bp{background:#9CD3B2;color:#10241A}
.bq{background:transparent;color:#C3B7BD;height:48px;font-weight:600}
</style>
</helmet>
<div class="scr">
  <div style="padding:120px 20px 0;opacity:.6" aria-hidden="true">
    <div style="font:700 34px/40px Figtree,sans-serif;letter-spacing:-0.02em">Good evening, Meera</div>
  </div>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Gentle day">
    <div class="hnd"></div>
    <div style="padding:20px 20px 28px;display:flex;flex-direction:column;gap:20px">
      <span style="width:56px;height:56px;border-radius:18px;background:rgba(156,211,178,.12);color:#9CD3B2;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg></span>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h1 style="margin:0;font:700 26px/32px Figtree,sans-serif;letter-spacing:-0.015em">Gentle day</h1>
        <p style="margin:0;font:400 16px/24px Figtree,sans-serif;color:#C3B7BD">Some days are harder. These moves are easy on your back. Do as many as feel good, and stop whenever you like.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <p class="cap" style="padding:0 4px 4px">From Level 1 of Back Recovery</p>
        <button class="ex"><span style="flex:1;display:flex;flex-direction:column"><span class="exn">Cat-Camel</span><span class="exm">2 sets · 10 reps</span></span><svg class="ic ch" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        <button class="ex"><span style="flex:1;display:flex;flex-direction:column"><span class="exn">Child's Pose</span><span class="exm">3 sets · hold 30s</span></span><svg class="ic ch" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        <button class="ex"><span style="flex:1;display:flex;flex-direction:column"><span class="exn">Knee-to-Chest Stretch</span><span class="exm">2 sets · 8 reps · hold 20s</span></span><svg class="ic ch" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="btn bp">Log a gentle session</button>
        <button class="btn bq">Close</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
