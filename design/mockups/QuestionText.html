<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question — free text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0F0B11}
*{box-sizing:border-box}
.scr{width:412px;height:915px;background:radial-gradient(120% 55% at 50% -12%,#2A1C2E 0%,#161118 62%);color:#F4EDEA;font-family:Figtree,system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column}
.safe{height:44px;flex:none}
.hdr{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:14px}
.ib{width:44px;height:44px;border-radius:999px;background:#211A24;border:0;color:#F4EDEA;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{flex:1;min-height:0;padding:20px 20px 0;display:flex;flex-direction:column;gap:24px;overflow:hidden}
.foot{flex:none;padding:12px 20px 28px;display:flex;flex-direction:column;gap:6px}
.btn{height:56px;width:100%;border-radius:999px;border:0;font:700 17px/20px Figtree,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 24px}
.bp{background:#9CD3B2;color:#10241A}
.cap{font:500 13px/18px Figtree,sans-serif;color:#9A8D95;margin:0}
.bar{display:flex;gap:6px}
.bar i{flex:1;height:6px;border-radius:99px;background:#372C3D}
.bar i.f{background:#9CD3B2}
.ta{width:100%;min-height:120px;border-radius:20px;background:#2B2230;border:0;padding:18px;font:500 18px/26px Figtree,sans-serif;color:#F4EDEA;resize:none;outline:none;box-shadow:inset 0 0 0 2px #9CD3B2}
</style>
</helmet>
<div class="scr">
  <div class="safe"></div>
  <div class="hdr">
    <button class="ib" aria-label="Previous question"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
      <div class="bar" style="width:100%"><i class="f"></i><i class="f" style="opacity:.5"></i><i></i><i></i><i></i><i></i></div>
      <span class="cap" style="font-size:12px">2 of 6</span>
    </div>
    <button class="ib" aria-label="Quit questions"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </div>
  <div class="main">
    <label for="dx" style="margin:0;font:700 26px/32px Figtree,sans-serif;letter-spacing:-0.015em">What were you diagnosed with?</label>
    <div style="display:flex;flex-direction:column;gap:10px">
      <textarea id="dx" class="ta">L4-L5 disc bulge</textarea>
      <p class="cap" style="padding:0 4px">e.g. L4-L5 disc bulge, muscle strain, sciatica... Your own words are fine.</p>
    </div>
  </div>
  <div class="foot">
    <button class="btn bp">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
