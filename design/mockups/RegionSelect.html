<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Region select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0F0B11}
*{box-sizing:border-box}
.scr{width:412px;height:915px;background:radial-gradient(120% 55% at 50% -12%,#2A1C2E 0%,#161118 62%);color:#F4EDEA;font-family:Figtree,system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column}
.safe{height:44px;flex:none}
.hdr{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.ib{width:44px;height:44px;border-radius:999px;background:#211A24;border:0;color:#F4EDEA;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{flex:1;min-height:0;padding:12px 20px 0;display:flex;flex-direction:column;gap:28px;overflow:hidden}
.p{font:400 16px/24px Figtree,sans-serif;color:#C3B7BD;margin:0}
.cap{font:500 13px/18px Figtree,sans-serif;color:#9A8D95;margin:0}
.tile{background:#211A24;border:0;border-radius:28px;padding:10px 10px 18px;display:flex;flex-direction:column;gap:14px;text-align:left;color:#F4EDEA;font-family:Figtree,sans-serif;box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 14px 32px -12px rgba(0,0,0,.55)}
.art{height:132px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.tn{font:700 20px/24px Figtree,sans-serif;margin:0;padding:0 8px}
.td{font:500 14px/20px Figtree,sans-serif;color:#C3B7BD;margin:0;padding:0 8px}
</style>
</helmet>
<div class="scr">
  <div class="safe"></div>
  <div class="hdr">
    <button class="ib" aria-label="Back to Home"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button>
    <span></span>
  </div>
  <div class="main">
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1 style="margin:0;font:700 34px/40px Figtree,sans-serif;letter-spacing:-0.02em">What would you like to work on?</h1>
      <p class="p">Pick one area. You can start another program for a different area later.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <button class="tile">
        <span class="art" style="background:rgba(182,165,234,.12)">
          <svg viewBox="0 0 160 110" style="width:150px;height:104px" aria-hidden="true">
            <path d="M18 92 H142" stroke="#B6A5EA" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"></path>
            <path d="M54 58 Q86 22 118 58" fill="none" stroke="#B6A5EA" stroke-width="11" stroke-linecap="round"></path>
            <path d="M56 62 L52 89" stroke="#B6A5EA" stroke-width="9" stroke-linecap="round"></path>
            <path d="M116 62 L120 89" stroke="#B6A5EA" stroke-width="9" stroke-linecap="round"></path>
            <circle cx="42" cy="58" r="10" fill="#F3B486"></circle>
          </svg>
        </span>
        <span class="tn">Back</span>
        <span class="td">Lower, mid, or upper back pain</span>
      </button>
      <button class="tile" disabled aria-disabled="true" style="opacity:.55">
        <span class="art" style="background:rgba(141,187,221,.10)">
          <svg viewBox="0 0 160 110" style="width:150px;height:104px" aria-hidden="true">
            <path d="M44 100 Q80 66 116 100" fill="none" stroke="#8DBBDD" stroke-width="11" stroke-linecap="round"></path>
            <path d="M80 78 L80 58" stroke="#8DBBDD" stroke-width="9" stroke-linecap="round"></path>
            <circle cx="88" cy="40" r="15" fill="#8DBBDD"></circle>
          </svg>
        </span>
        <span style="display:flex;align-items:center;justify-content:space-between;padding-right:8px"><span class="tn">Neck</span><span style="height:24px;padding:0 8px;border-radius:8px;background:#2B2230;color:#C3B7BD;font:600 12px/24px Figtree,sans-serif">Coming soon</span></span>
        <span class="td">Neck and shoulder tension</span>
      </button>
    </div>
    <p class="cap" style="text-align:center">More areas are on the way.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
